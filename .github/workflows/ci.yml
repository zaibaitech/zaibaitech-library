name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and content tests
        run: npm test

      - name: Translation validation
        run: npm run translations:check

      - name: Generated content is up to date
        run: |
          # Books with a deterministic build script must have their generated JSON committed and current.
          for script in scripts/build-risala.mjs scripts/build-three-books.mjs; do
            if [ -f "$script" ]; then node "$script" --check; fi
          done

      - name: Production build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser tests (accessibility, reader, publication gate, Arabic layout)
        run: npm run test:browser

  webkit:
    name: Browser tests in WebKit (Safari engine)
    runs-on: ubuntu-latest
    # Playwright's own image has WebKit and every system library it needs already installed, so the job does not
    # download them from the Ubuntu mirror (which has taken most of half an hour on a slow day). The image tag must
    # match the playwright version in package.json; the setup check below fails if they drift apart.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check WebKit is preinstalled for this Playwright version
        run: node -e "const { webkit } = require('playwright'); require('node:fs').accessSync(webkit.executablePath()); console.log(webkit.executablePath())"

      - name: Production build
        run: npm run build

      - name: Browser tests (WebKit)
        run: npm run test:browser
        timeout-minutes: 20
        env:
          BROWSER: webkit
